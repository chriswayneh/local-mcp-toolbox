name: Documentation

on:
  pull_request:
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "docs/**"
      - "examples/**"
      - "demo/**"
      - "scripts/validate_docs.py"
      - "tests/unit/test_demo_assets.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "docs/**"
      - "examples/**"
      - "demo/**"
      - "scripts/validate_docs.py"
      - "tests/unit/test_demo_assets.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate local documentation links and commands
        run: python scripts/validate_docs.py
      - name: Validate configuration and demo assets
        run: python -m pytest tests/unit/test_demo_assets.py
