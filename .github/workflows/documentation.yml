name: Documentation

on:
  pull_request:
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "docs/**"
      - "examples/**"
      - "demo/**"
      - "scripts/validate_docs.py"
      - "tests/unit/test_demo_assets.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "docs/**"
      - "examples/**"
      - "demo/**"
      - "scripts/validate_docs.py"
      - "tests/unit/test_demo_assets.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate local documentation links and commands
        run: python scripts/validate_docs.py
      - name: Validate configuration and demo assets
        run: python -m pytest tests/unit/test_demo_assets.py
