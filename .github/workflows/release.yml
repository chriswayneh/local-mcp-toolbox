name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Project version without the v prefix (for example 0.1.0)"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE to confirm publishing the existing v<version> tag"
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirmation == 'RELEASE' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and release tooling
        run: python -m pip install -e ".[dev,docker,release]"
      - name: Verify tag and package version agree
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; expected = os.environ['RELEASE_VERSION']; assert version == expected, f'pyproject.toml={version!r}; requested={expected!r}'"
          git describe --exact-match --tags HEAD | grep -Fx "v${RELEASE_VERSION}"
      - name: Run release checks
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy src
          python -m pytest
          python -m bandit -q -r src
          python -m pip_audit
          python scripts/validate_docs.py
      - name: Build distribution and SBOM
        run: |
          python -m build
          cyclonedx-py environment --output-file dist/sbom.cdx.json
      - name: Create GitHub release from checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v${RELEASE_VERSION}" dist/* --title "v${RELEASE_VERSION}" --generate-notes
