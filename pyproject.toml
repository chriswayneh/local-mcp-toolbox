[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-mcp-toolbox"
version = "0.1.0a0"
description = "Secure, local-first, read-only MCP tools for developer environment inspection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Local MCP Toolbox contributors" }]
keywords = ["mcp", "model-context-protocol", "security", "devops", "docker"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "mcp[cli]>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0.2,<7",
  "structlog>=24.4,<27",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2",
  "mypy>=1.14,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]
docker = ["docker>=7.1,<8"]
kubernetes = ["kubernetes>=32,<35"]
release = [
  "build>=1.2,<3",
  "cyclonedx-bom>=5,<8",
]

[project.scripts]
local-mcp-toolbox = "mcp_toolbox.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_toolbox"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_toolbox"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = ["mcp_toolbox"]

[tool.bandit]
exclude_dirs = ["tests", "demo"]
