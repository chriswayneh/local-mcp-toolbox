# Opt-in local inspection profile. Replace example paths before use.
profile: standard
filesystem:
  approved_roots:
    - /absolute/path/to/approved/project
  allowed_extensions: [".md", ".txt", ".json", ".yaml", ".yml", ".toml", ".py", ".ts", ".js", ".go"]
  blocked_patterns: [".env", ".env.*", "id_rsa", "id_ed25519", "*.pem", "*.key", "credentials*"]
  max_file_bytes: 240000
  max_directory_entries: 500
integrations:
  docker: true
  git: true
  logs: false
  security_scanners: false
  infrastructure: false
  incident: false
  github: false
  kubernetes: false
  ollama: false
  environment: false
  external_network: false
  external_ai: false
git:
  approved_repositories:
    - /absolute/path/to/approved/project
github:
  approved_repositories: []
kubernetes:
  approved_contexts: []
  approved_namespaces: []
ollama:
  host: 127.0.0.1
  port: 11434
  approved_models: []
  max_prompt_chars: 8000
environment:
  approved_roots: []
  blocked_patterns: [".env", ".env.*", "id_rsa", "id_ed25519", "*.pem", "*.key", "credentials*"]
  max_directory_entries: 1000
  max_metadata_files: 500
  max_config_file_bytes: 32768
  max_metadata_file_bytes: 262144
  max_dependency_records: 5000
  max_dependencies_per_distribution: 500
logs:
  approved_roots: []
  allowed_extensions: [".log", ".txt", ".jsonl", ".out"]
  blocked_patterns: [".env", ".env.*", "*.pem", "*.key", "credentials*"]
  max_file_bytes: 5242880
  max_directory_entries: 500
security:
  approved_roots: []
  allowed_extensions: []
  blocked_patterns: [".env", ".env.*", "*.pem", "*.key", "credentials*"]
  max_file_bytes: 1048576
  max_directory_entries: 500
infrastructure:
  approved_roots: []
  allowed_extensions: []
  blocked_patterns: [".env", ".env.*", "*.pem", "*.key", "credentials*"]
  max_file_bytes: 1048576
  max_directory_entries: 500
incident:
  approved_roots: []
  allowed_extensions: [".log", ".txt", ".jsonl", ".out"]
  blocked_patterns: [".env", ".env.*", "*.pem", "*.key", "credentials*"]
  max_file_bytes: 5242880
  max_directory_entries: 500
limits:
  max_records: 100
  max_output_bytes: 262144
  timeout_seconds: 10
audit:
  path: ./audit/events.jsonl
  retention_days: 30
redaction:
  redact_home_paths: true
  redact_emails: false
  redact_ip_addresses: false
