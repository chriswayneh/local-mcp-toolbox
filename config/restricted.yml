# Default profile. No external integrations are enabled.
profile: restricted
filesystem:
  approved_roots: []
  allowed_extensions: [".md", ".txt", ".json", ".yaml", ".yml", ".toml", ".py", ".ts"]
  blocked_patterns: [".env", ".env.*", "id_rsa", "id_ed25519", "*.pem", "*.key", "credentials*"]
  max_file_bytes: 240000
  max_directory_entries: 500
integrations:
  docker: false
  git: false
  github: false
  environment: false
  external_network: false
git:
  approved_repositories: []
github:
  approved_repositories: []
environment:
  approved_roots: []
  blocked_patterns: [".env", ".env.*", "id_rsa", "id_ed25519", "*.pem", "*.key", "credentials*"]
  max_directory_entries: 1000
  max_metadata_files: 500
  max_config_file_bytes: 32768
  max_metadata_file_bytes: 262144
  max_dependency_records: 5000
  max_dependencies_per_distribution: 500
limits:
  max_records: 100
  max_output_bytes: 262144
  timeout_seconds: 10
audit:
  path: ./audit/events.jsonl
  retention_days: 30
http:
  enabled: false
  host: 127.0.0.1
  port: 8765
  token_environment: LOCAL_MCP_TOOLBOX_HTTP_TOKEN
  max_request_body_bytes: 262144
  session_idle_seconds: 300
  max_sessions: 16
redaction:
  redact_home_paths: true
  redact_emails: false
  redact_ip_addresses: false
