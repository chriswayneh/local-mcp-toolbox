# Default profile. No external integrations are enabled.
profile: restricted
filesystem:
  approved_roots: []
  allowed_extensions: [".md", ".txt", ".json", ".yaml", ".yml", ".toml", ".py", ".ts"]
  blocked_patterns: [".env", ".env.*", "id_rsa", "id_ed25519", "*.pem", "*.key", "credentials*"]
  max_file_bytes: 240000
  max_directory_entries: 500
integrations:
  docker: false
  git: false
  github: false
  kubernetes: false
  external_network: false
  external_ai: false
git:
  approved_repositories: []
limits:
  max_records: 100
  max_output_bytes: 262144
  timeout_seconds: 10
audit:
  path: ./audit/events.jsonl
  retention_days: 30
redaction:
  redact_home_paths: true
  redact_emails: false
  redact_ip_addresses: false
